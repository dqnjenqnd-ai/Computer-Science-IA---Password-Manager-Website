{% extends "base.html" %}
{% block title %}{{ 'Edit password' if mode == 'edit' else 'Add password' }}{% endblock %}

{% block content %}
<!-- One form used for BOTH the "Add password page" and the "Edit password page"
     from Criterion C. The route sends mode='add' or mode='edit', and `form` holds the values
     to show (empty for a new entry, the saved values when editing, or what the user just typed
     when a validation error sends them back). -->
<form method="POST">
  <h3 align="center" class="mt-3">{{ 'Edit password' if mode == 'edit' else 'Add password' }}</h3>

  <div class="form-group">
    <label for="website_name">Website</label>
    <input type="text" class="form-control" id="website_name" name="website_name"
           placeholder="e.g. instagram.com" value="{{ form.get('website_name', '') }}" />
  </div>
  <div class="form-group">
    <label for="account_username">Username</label>
    <input type="text" class="form-control" id="account_username" name="account_username"
           placeholder="Enter username" value="{{ form.get('account_username', '') }}" />
  </div>
  <div class="form-group">
    <label for="account_email">Email</label>
    <input type="text" class="form-control" id="account_email" name="account_email"
           placeholder="Enter the email used for this account" value="{{ form.get('account_email', '') }}" />
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <div class="input-group">
      <input type="password" class="form-control" id="password" name="password"
             placeholder="Enter the account password" value="{{ form.get('password', '') }}"
             autocomplete="off" />
      <div class="input-group-append">
        <button type="button" class="btn btn-outline-secondary" onclick="togglePassword()">Show</button>
      </div>
    </div>
  </div>
  <div class="form-group">
    <label for="note">Note (optional)</label>
    <textarea class="form-control" id="note" name="note" rows="3">{{ form.get('note', '') }}</textarea>
  </div>

  <button type="submit" class="btn btn-primary">{{ 'Save changes' if mode == 'edit' else 'Save password' }}</button>
  <a href="{{ url_for('views.view_password', entry_id=entry_id) if mode == 'edit' else url_for('views.home') }}"
     class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}

{% block JavaScript %}
<script type="text/javascript">
  // Show / hide the password while typing
  function togglePassword() {
    const box = document.getElementById("password");
    box.type = box.type === "password" ? "text" : "password";
  }
</script>
{% endblock %}
